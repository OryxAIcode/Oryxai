name: Publish JetBrains Plugin

on:
  push:
    tags:
      - 'jetbrains-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/ide-plugin-jetbrains
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@3a4f6e1af35d0b85369b8699a9e3b3f81c8b8e3 # v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Sign plugin
        run: ./gradlew signPlugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.JB_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JB_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JB_PRIVATE_KEY_PASSWORD }}

      - name: Publish plugin
        run: ./gradlew publishPlugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.JB_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JB_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JB_PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
